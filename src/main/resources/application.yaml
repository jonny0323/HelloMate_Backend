spring:
  application:
    name: HelloMateBackend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hellomate}
    username: ${DB_USERNAME:hellomate}
    password: ${DB_PASSWORD:hellomate}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # Flyway가 스키마를 관리
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    show-sql: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /api-docs

hellomate:
  jwt:
    secret: ${JWT_SECRET:hellomate-local-dev-secret-key-change-me-in-production-0123456789}
    access-token-validity-ms: 3600000      # 1h
    refresh-token-validity-ms: 86400000    # 1d  (자동 로그인 미체크)
    refresh-token-validity-auto-login-ms: 2592000000  # 30d (자동 로그인 체크)
  academic:
    # 대시보드 '이번 학기' 경계. 학사일정 테이블이 생기기 전까지의 기준값이다.
    first-semester-start-month: 3
    second-semester-start-month: 9
  file:
    base-url: ${FILE_BASE_URL:https://cdn.hellomate.app}
  cors:
    # 담당자 콘솔(Vite) 기본 포트. 배포에서는 CORS_ALLOWED_ORIGINS로 실제 도메인을 넣는다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173}
  seed:
    # 로컬에서 빈 DB로 띄우면 로그인할 계정조차 없어서 화면 확인이 불가능하다.
    # .env에 SEED_ENABLED=true를 넣은 개발 환경에서만 데모 데이터를 넣는다.
    enabled: ${SEED_ENABLED:false}
