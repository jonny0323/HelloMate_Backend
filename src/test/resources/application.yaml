spring:
  application:
    name: HelloMateBackend

  datasource:
    url: jdbc:h2:mem:hellomate;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

hellomate:
  jwt:
    secret: "hellomate-test-secret-key-0123456789-0123456789"
    access-token-validity-ms: 3600000
    refresh-token-validity-ms: 86400000
    refresh-token-validity-auto-login-ms: 2592000000
  academic:
    # 대시보드 '이번 학기' 경계. 학사일정 테이블이 생기기 전까지의 기준값이다.
    first-semester-start-month: 3
    second-semester-start-month: 9
  file:
    base-url: "https://cdn.hellomate.test"
